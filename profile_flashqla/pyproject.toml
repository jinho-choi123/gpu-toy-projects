[project]
name = "profile-flashqla"
version = "0.1.0"
description = "Profile Flash QLA through Flash Linear Attention"
requires-python = ">=3.13,<3.14"
readme = "README.md"
authors = [
    { name = "jinho-choi123", email = "61547655+jinho-choi123@users.noreply.github.com" }
]
dependencies = [
    "accelerate==1.14.0",
    "flash-linear-attention==0.5.2",
    "flash-qla==0.1.2",
    "loguru==0.7.3",
    "transformers==5.16.1",
    "torch==2.11.0"
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu129", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"


[dependency-groups]
dev = [
    "cmake==3.26.0",
    "ninja==1.13.0",
    "pybind11==3.0.4",
    "pre-commit==4.6.0",
    "pytest==9.0.3",
    "pytest-env>=1.7.0",
    "ruff==0.15.14",
    "ty==0.0.38",
]

[tool.uv]
default-groups = ["dev"]
environments = ["sys_platform == 'linux'"]


[pytest_env]
CUDA_VISIBLE_DEVICES="0"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "T201", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty.src]
include = ["src", "scripts", "tests"]
exclude = ["docs/"]
