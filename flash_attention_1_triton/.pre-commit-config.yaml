repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-toml
          - id: check-json
          - id: check-added-large-files
            args: [--maxkb=5120]
          - id: check-merge-conflict
          - id: mixed-line-ending
            args: [--fix=lf]
          - id: detect-private-key
          - id: check-case-conflict
          - id: debug-statements

    - repo: local
      hooks:
          - id: ruff-check
            name: ruff check
            entry: uv run ruff check --fix --force-exclude
            language: system
            types_or: [python, pyi]
            require_serial: true

          - id: ruff-format
            name: ruff format
            entry: uv run ruff format --force-exclude
            language: system
            types_or: [python, pyi]
            require_serial: true

          - id: ty-check
            name: ty check
            entry: uv run ty check
            language: system
            pass_filenames: false
            always_run: true
